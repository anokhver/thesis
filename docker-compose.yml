services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Flip to "1" after merging the ML pipeline so the image installs
        # requirements.txt (torch / monai / aicsimageio / ...) too.
        INCLUDE_ML: "0"
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - db_data:/app/db
      - media_data:/app/media
    restart: unless-stopped
    # Single web worker so the in-process job executor stays consistent;
    # see synapse_web/services/jobs.py for the rationale.
    command: >
      bash -c "python manage.py makemigrations &&
               python manage.py migrate &&
               python manage.py recover_stale_runs &&
               python manage.py runserver 0.0.0.0:8000"

volumes:
  db_data:
  media_data:

