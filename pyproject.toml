[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-synapse-segmentation"
version = "0.1.0"
description = "Self-supervised segmentation of synaptic structures in fluorescence microscopy"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Veronika Anokhina" },
]
license = { text = "MIT" }
# TODO: confirm with thesis supervisor (Ing. Vojtěch Brejtr) that MIT
# is acceptable for FEL OI bachelor's thesis code submission. The
# placeholder unblocks publishing the Docker image; revise here and in
# LICENSE if the faculty requires a different license.

# Core runtime dependencies. See requirements.txt for the full pinned list
# used in development (CUDA-specific torch builds belong there, not here).
#
# GPU note: requires NVIDIA GPU with compute capability >= 7.0 (Volta+).
# Pascal GPUs (GTX 10xx, sm_61) need PyTorch <=2.5 — see README.md.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "monai>=1.3",
    "einops>=0.7",
    "torch>=2.0",
    "torchvision>=0.15",
]

[project.optional-dependencies]
# Heavy or environment-specific extras — install only when needed.
imaging = [
    "aicsimageio~=4.14.0",
    "napari>=0.6",
]
notebooks = [
    "jupyterlab",
    "ipywidgets",
    "papermill",
]
spotiflow = [
    "spotiflow",
]
dev = [
    "pytest>=7",
]

# ---------------------------------------------------------------------------
# Package layout
# ---------------------------------------------------------------------------
# Standard PyPA "src layout".  The umbrella package ``synaptic_ssl`` lives
# under ``src/`` and becomes importable after ``pip install -e .``:
#     from synaptic_ssl.training import ModelCfg
# Everything outside ``src/`` (imaging/, notebooks/, tests/, configs/,
# scripts/) is intentionally not part of the installable package.
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["synaptic_ssl*"]
exclude = ["__pycache__*"]
